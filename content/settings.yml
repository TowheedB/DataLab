director:
  name: Dr. Faezeh Ensan
  title: Associate Professor, P.Eng.
  initials: FE
  home_blurb: Dr. Ensan leads the Data Lab at Toronto Metropolitan University. Her research spans knowledge modeling and semantic reasoning, text processing and retrieval, biomedical scholarly search, and responsible neural text models. She received the Dean's Teaching Award in 2023 and serves on the editorial board of *Discover Artificial Intelligence*, having guest-edited special issues of *Information Processing & Management* and the *Journal of Biomedical Informatics*.
  bio: PhD in Computer Science (University of New Brunswick, 2011); MSc and BSc in Computer Engineering (Ferdowsi University of Mashhad; University of Tehran). Previously a postdoctoral fellow at UBC, Athabasca University and UNB, and Assistant Professor at Ferdowsi University of Mashhad. At TMU since 2019.
